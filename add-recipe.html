<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="theme.css">
        <link rel="stylesheet" href="styles.css">
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Recipe tool</title>
       <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">-->
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">    
</head>
    <body>
       <nav>
            <a href="index.html"><img class="logo" src="images/logo.svg" alt="Recipe tool"></a>
           <div class="navigation-actions">
            <form id="search-form">
               <input type="search" id="search" name="search">
            </form>
                
            </div>
            

</nav>
        <a class="navigation-action" href="index.html" id="add-recipe-back-button">
            <i data-lucide="chevron-left"></i>
            <span id="add-recipe-back-caption"></span>
        </a>
        <main>
            <h1 id="add-recipe-title"></h1>
            <form method="POST" action="" id="add-recipe-form">
                <fieldset>
                    <div class="form-field">
                        <label for="recipe-title" id="add-recipe-title-label"></label>
                        <input type="text" id="recipe-title" name="recipe-title-input-name" required>
                        <div class="form-field_error"></div>
                    </div>
                    <div class="form-field">
                        <label id="add-recipe-ingredients-label" for="ingredient-item"></label>
                        <div class="chip-field">
                            <div id="chips-container" class="chip-field__chips"></div>
                            <input type="text" id="ingredient-item" class="chip-field__input">
                            
                        </div>
                        <button type="button" id="add-recipe-add-ingredient" class="button button--secondary"></button>
                        
                    </div>
                    <div class="form-field">
                        <label for="recipe-description" id="recipe-description-label"></label>
                        <textarea id="recipe-description-textarea" name="recipe-description-input-name" ></textarea>
                        <div class="form-field_error"></div>           
                    </div>
                    <div class="form-field">

                    <label for="recipe-category" id="add-recipe-category"></label>
                    <select id="recipe-category" name="recipe-category" required>
                        <option value="" id="category-placeholder"></option>
                        
                    </select>
                    <div class="form-field_error"></div>
                    </div>
                    
                    <!--<button>Add tag</button>
                    <button>Add tip</button>-->
                    <button class="button button--primary" id="add-recipe-save-button" type="submit"></button>
                    
                </fieldset>
                </form>
        </main>
        
            
            <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
            <script src="strings.en.js"></script>
    <script src="seed-recipes.js"></script>
            <script src="recipes.js"></script>
            <script src="add-recipe.js"></script>
    </body>
</html>
